# Stream buffer: Redis Streams with a consumer group gives a durable,
# replayable log (AOF persistence on a PVC) and pending-entry tracking.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: { app: redis }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports: [{ containerPort: 6379, name: redis }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: redis }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
