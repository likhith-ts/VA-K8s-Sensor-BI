# Queue-depth + CPU autoscaling for the process workers via KEDA.
# Requires KEDA (https://keda.sh): 
#   kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.16.1/keda-2.16.1.yaml
# Then replace the CPU-only HPA:
#   kubectl -n envbi delete hpa process && kubectl apply -f deploy/k8s/optional/keda-process.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: process
  namespace: envbi
spec:
  scaleTargetRef: { name: process }
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 120
  triggers:
    # One extra pod per 2,000 entries waiting in the consumer group.
    - type: redis-streams
      metadata:
        address: redis.envbi.svc.cluster.local:6379
        stream: telemetry:raw
        consumerGroup: processors
        lagCount: "2000"
        activationLagCount: "1"
    - type: cpu
      metricType: Utilization
      metadata: { value: "60" }
